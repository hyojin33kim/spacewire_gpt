schema_version: 1
artifact_id: RTL-CONTRACT-ENCODING-V0.1
semantic_baseline: semantic-encoding-v0.1
golden_validation: traceability/golden_validation_encoding_v0.1.yaml
status: draft_blocked
purpose: >
  Convert validated Encoding semantics into cycle-level FPGA obligations without
  changing protocol meaning. RTL implementation is prohibited until this
  contract is reviewed and all blocking decisions are closed.

implementation_profile:
  intent: flight_fpga
  system_clock_hz:
    value: 100000000
    status: confirmed
  minimum_link_rate_mbps:
    value: 2
    status: required_unless_project_tailoring
  initial_link_rate_mbps:
    value: 10
    tolerance_mbps: 1
    status: normative
  maximum_operational_link_rate_mbps:
    value: 200
    status: confirmed_project_requirement
  target_fpga_family_device:
    value: "Xilinx Zynq-7020 (7-series)"
    status: confirmed

module_partition:
  - spw_encoding_tx
  - spw_encoding_rx
  - spw_encoding_top
  - ds_rx_frontend
  - link_rate_generator

data_link_to_encoding_tx:
  handshake: valid_ready
  accepted_on: rising_clk_when_valid_and_ready
  ordering: preserve_accept_order
  item_union:
    - DATA_CHARACTER
    - FCT
    - EOP
    - EEP
    - ESC
    - NULL
    - BROADCAST_CODE
  fields:
    - tx_item_valid
    - tx_item_ready
    - tx_item_kind
    - tx_data_7_0
  note: >
    Union item interface is an RTL implementation choice that preserves §5.4.2
    character/control-code semantics despite the narrower TX_CHAR.request wording
    in §6.3.

data_link_control:
  inputs:
    - tx_enable
    - rx_enable
    - link_left_error_reset
    - link_rate_setting
  outputs:
    - got_null
    - disconnect
    - rx_error_valid
    - rx_error_kind
    - rx_item_valid
    - rx_item_kind
    - rx_data_7_0
  status_realization:
    got_null: level_until_rx_enable_deasserted
    disconnect: latched_until_rx_enable_deasserted
    rx_error_valid: latched_until_rx_enable_deasserted
    rx_error_kind: [PARITY_ERROR, ESC_ERROR]
  classification: implementation_choice_preserving_semantic_events

physical_DS_interface:
  tx_outputs: [data_o, strobe_o]
  rx_inputs: [data_i, strobe_i]

  architectural_boundary:
    fixed: true
    rule: >
      The RX PHY is a Xilinx-7-series-specific implementation boundary.
      Its internal capture method is intentionally not frozen at this stage.
      It shall present decoded receive items and receive events into the
      100 MHz protocol-core domain through an explicit CDC boundary.
    rx_phy_vendor_scope: xilinx_7_series_specific
    core_side_clock_hz: 100000000
    core_side_outputs:
      - rx_item_valid
      - rx_item_kind
      - rx_data_7_0
      - got_null_event_or_state
      - parity_error_event
      - ESC_error_event
      - disconnect_event
    cdc_required_if_frontend_not_100MHz_domain: true

  rx_frontend_obligation:
    - detect_normal_single_signal_DS_transitions
    - recover_serial_data_bit_value
    - tolerate_simultaneous_Data_Strobe_transition_without_lockup
    - preserve_receive_order
    - transfer_decoded_items_and_events_safely_to_100MHz_core_domain

  capture_microarchitecture:
    architecture: recovered_edge_with_programmable_sampling_delay
    status: ARCHITECTURE_SELECTED_DETAIL_FEASIBILITY_PENDING
    rationale:
      - supports_wide_2_to_200_Mbps_input_rate_without_high_ratio_global_oversampling
      - aligns_with_ECSS_5_3_7_receiver_timing_model_using_edge_recovery_and_receiver_delay
      - keeps_high_speed_vendor_specific_logic_inside_RX_PHY_boundary
    conceptual_path:
      - differential_Data_and_Strobe_inputs
      - input_buffering
      - recovered_edge_generation_from_Data_Strobe_transition_information
      - programmable_sampling_delay
      - sample_Data_at_delayed_recovered_edge
      - bit_recovery
      - deserialisation_and_character_decode
      - explicit_CDC_or_elastic_buffer_to_100MHz_core_domain
    programmable_delay:
      purpose: move_sampling_instant_away_from_Data_Strobe_edge_uncertainty
      exact_primitive: TBD_Xilinx_7_series_feasibility
      exact_delay_taps: TBD_from_skew_jitter_budget_and_STA
      calibration_policy: TBD
    recovered_edge_clocking:
      exact_Xilinx_clocking_primitive_path: TBD
      prohibition:
        - no_unconstrained_LUT_generated_clock_into_general_fabric
        - do_not_propagate_recovered_clock_into_DataLink_Router_or_AXI_domains
    selection_dependencies_remaining:
      - Zynq_7020_legal_SelectIO_and_clock_routing
      - 200_Mbps_static_timing_and_input_timing_closure
      - physical_skew_jitter_budget
      - minimum_tolerated_edge_separation
      - CDC_and_reset_behavior_when_recovered_edges_stop

tx_state_and_storage:
  required_state:
    - previous_payload_for_next_parity
    - serializer_shift_state
    - current_Data
    - current_Strobe
    - first_Null_after_TX_enable_state
  fifo_depth: 0
  buffering: one_inflight_item_minimum
  deeper_prefetch: optional_implementation_choice

rx_state_and_storage:
  required_state:
    - current_Data
    - current_Strobe
    - deserializer_state
    - previous_character_payload_for_parity_check
    - ESC_sequence_state
    - gotNull
    - disconnect_armed
    - disconnect_timer
    - latched_error_kind

reset_contract:
  external_reset:
    policy: async_assert_sync_deassert_inside_each_clock_domain
    classification: FPGA_assurance_choice
  tx_enable_deassert:
    action: reset_TX_character_encoder_serializer_DS_encoder_and_output_driver_semantic_state
  rx_enable_deassert:
    action:
      - reset_RX_decoder_deserializer_character_decoder_semantic_state
      - clear_gotNull
      - clear_disconnect_and_receive_error_latches
  DS_power_up:
    Data: 0
    Strobe: 0
  controlled_DS_reset:
    sequence: reset_one_signal_then_the_other
    simultaneous_transition_forbidden: true
    delay_constraint: "T_fastest <= delay <= 500 ns"
    exact_cycle_count:
      preferred_if_clk_100MHz: 50
      resulting_delay_ns: 500
      status: implementation_choice_subject_to_clock_confirmation

disconnect_timer:
  semantic_range_ns: ">727 and <=1000"
  nominal_choice_ns: 850
  if_clk_100MHz:
    clock_period_ns: 10
    threshold_cycles: 85
  status: implementation_choice_subject_to_clock_confirmation

link_rate_generation:
  initial_after_reset_or_disconnect: "10 ±1 Mbps"
  minimum_supported_unless_tailored: "2 Mbps"
  max_rate: "200 Mbps"
  implementation:
    value: TBD
    reason: depends_on_required_rate_range_and_FPGA_clocking_resources
  management_input: link_rate_setting

cycle_level_latency:
  tx_item_accept_to_first_serial_bit:
    value: TBD_after_link_rate_generator_choice
  rx_DS_transition_to_decoded_item:
    value: TBD_after_RX_frontend_choice
  error_detection_to_status_output:
    requirement: bounded_and_deterministic
    exact_cycles: TBD_after_RX_frontend_choice

CDC_and_timing_assurance:
  rules:
    - no_raw_asynchronous_Data_or_Strobe_signal_may_feed_general_state_logic_without_defined_capture_strategy
    - all_cross_domain_events_require_documented_synchronization_or_async_FIFO_handshake
    - reset_deassertion_must_be_synchronous_per_clock_domain
  constraints_to_produce:
    - create_clock_and_generated_clock_constraints
    - CDC_exceptions_only_with_structural_justification
    - input_timing_or_vendor_input_primitive_constraints_for_DS_frontend

traceability:
  semantic_contracts:
    - BC-ENC-CHAR-001
    - BC-ENC-DS-001
    - BC-ENC-IF-001
    - BC-ENC-RXERR-001
    - BC-ENC-PIPE-001
    - BC-ENC-RATE-001
  golden_validation_vectors: "45/45 mapped"
  planned_SVA:
    - SVA-ENC-001_TX_order_preserved
    - SVA-ENC-002_no_RX_delivery_before_gotNull
    - SVA-ENC-003_gotNull_clear_on_RX_disable
    - SVA-ENC-004_no_simultaneous_DS_transition_normal_TX
    - SVA-ENC-005_disconnect_not_before_arm
    - SVA-ENC-006_disconnect_threshold_behavior
    - SVA-ENC-007_parity_error_gated_by_gotNull
    - SVA-ENC-008_ESC_error_gated_by_gotNull
    - SVA-ENC-009_receive_error_kind_stable_while_latched

resolved_project_inputs:
  - id: RTL-BLOCK-001
    decision: target_FPGA_family_and_device
    value: "Xilinx Zynq-7020"
    status: closed
  - id: RTL-BLOCK-002
    decision: mission_required_maximum_operational_link_rate
    value: "200 Mbps"
    status: closed
  - id: RTL-BLOCK-003
    decision: system_clock_for_protocol_core
    value: "100 MHz"
    status: closed

resolved_architecture_decisions:
  - id: RTL-BLOCK-004A
    decision: RX_PHY_capture_architecture
    value: recovered_edge_with_programmable_sampling_delay
    status: closed

remaining_blocking_decisions_before_review:
  - id: RTL-BLOCK-004B
    decision: prove_Zynq_7020_recovered_edge_delay_implementation
    reason: >
      Exact Xilinx 7-series input-delay and clock-routing primitive choices,
      delay range/taps, edge-separation tolerance, and 200 Mbps timing closure
      must be demonstrated before RTL Contract review can close.
  - id: RTL-BLOCK-005
    decision: define_AXI4_Lite_clock_and_register_CDC_contract
    reason: >
      AXI4-Lite will be added later; decide whether ACLK is physically shared
      with the 100 MHz core clock or isolated behind a register/CDC wrapper.

hard_gate:
  RTL_implementation_allowed: false
  becomes_true_when:
    - RTL-BLOCK-004B_closed
    - RTL-BLOCK-005_closed
    - contract_status_reviewed
