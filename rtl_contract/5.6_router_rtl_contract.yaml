  RTL_implementation_allowed: false
  reviewed: false
  blockers: [NR-DEC-03, NR-TECH-03, NR-TECH-04]

closure_status:
  NR-DEC-01:
    status: closed_user_approved_direction
    scope: >
      Four external ports plus Port 0; reuse Data Link FIFOs; rotating-order
      packet arbitration. Parameter range and final FPGA resource feasibility
      remain implementation/verification concerns, not a reopened architecture choice.
  NR-TECH-02:
    status: closed_by_lower_layer_contract_draft
    evidence_branch: contracts/dl-encoding-cross-layer-v0.1
    evidence_head: 83c424fe7eab6dd1293591930fbb7a9d1f1af923
    note: >
      Accepted-but-uncommitted EOP/EEP is retained as a reserved TX FIFO head
      until commit or explicit pre-commit flush resolution, preventing accidental
      discard of a following packet.

  NR-TECH-01:
    status: design_closed_verification_pending
    decision: >
      Output ownership is held through local terminal serial completion, not merely
      terminal acceptance into the DataLink TX FIFO and not merely Encoding commit.
      Per-N-Char ready and new-packet ready are distinct.
  NR-DEC-02:
    status: design_closed_verification_pending
    decision: >
      Per-output Router timeout uses a Router-to-DataLink abort handshake. DataLink
      discards only the unsent current output packet remainder and emits one
      synthetic EEP through the normal credited Encoding path without resetting
      the link. Multicast interaction remains under NR-TECH-04.

inherited_semantics:
  source: contracts/5.6_router.yaml
  features: [path, logical, logical_deletion, adaptive_logical, multicast, per_port_timeout, timecode_relay, interrupt_and_ack_relay]
  legacy_path_adaptive: false
  packet_length_limit: none
  FIFO_depth_per_DataLink_TX_RX: 128
  DataLink_credit_max: 56
  note: This draft proposes no removal of existing reference features.

implementation_proposal:
  decision: NR-DEC-01
  decision_status: closed_user_approved_direction
  clock_hz: 100000000
  external_ports_default: 4
  external_ports_parameter_range: [1, 31]
  configuration_port: 0
  count_rationale: Matches current RouterModel default, not an approved FPGA resource estimate.
  storage: DataLink_RX_TX_FIFOs_plus_one_registered_ingress_head_per_input
  no_additional_whole_packet_buffer: true
  blocks: [ingress_head, route_lookup, allocator, crossbar, timeout_control, broadcast_engine, configuration_adapter]
  timing: >
    Transfer at rising core edge only. Head register is filled independently of
    downstream ready. Lookup and grant are registered; no same-edge release/regrant.
    Exact pipeline latency and table implementation require NR-TECH-04 closure.
  reset: >
    RouterReset resets all ports, clears head/ownership/event state, invalidates
    logical entries and disables adaptive/multicast. Partial PortReset requires
    packet-aware coordination; it is not implicitly a global RouterReset.

addressing:
  references: [5.6.8.2, 5.6.8.3, 5.6.8.4, 5.6.8.5, 5.6.8.6]
  path:
    zero: configuration_endpoint_only
    external: ports_1_through_configured_N
    absent_port: discard_through_first_terminator_and_record_invalid_address
    header: consume_exactly_once
  logical:
    usable_addresses: [32, 254]
    address_255: discard_and_record_invalid_address_per_frozen_semantics
    entry_fields_proposed: [valid, output_mask, delete_header, adaptive, multicast]
    retained_unless_deletion_enabled: true
    deletion_count_max_per_hop: 1
    invalid_entry: discard_through_first_terminator_and_record_invalid_address
    configuration_port_target: prohibited_by_5_6_8_3_f
    conflicting_mode_bits: configuration_write_rejected_proposal
  empty_packet: >
    EOP/EEP in the header-wait state is consumed locally without allocating output;
    follow CR-NET-001. Deleting a real header is distinct from receiving an empty packet.
  updates: >
    Proposed route snapshot at allocation, frozen for the packet. Management writes
    must be atomic; lookup/write collision, invalid combination handling and table
    versioning require NR-DEC-03 and NR-TECH-04.

allocation:
  inherited: fair_packet_level_wormhole
  proposal: >
    A rotating input-order allocator scans eligible packet requests and grants
    disjoint free output sets. Adaptive chooses one eligible output with a rotating
    candidate cursor. Multicast reserves its complete eligible set atomically,
    never a partial subset. Disjoint unicasts may proceed together.
  fairness: >
    Exact Golden round-robin winners are not normative. Prove no permanent
    exclusion under recurrent eligibility and completed competing packets;
    do not promise a cycle bound for unbounded packets or blocked sinks.
    Multicast starvation under asymmetric port availability is NR-TECH-04.
  ownership_release:
    acquire: >
      Allocate only when net_tx_new_packet_ready is asserted. The winning input
      owns the output for the packet.
    normal_release: >
      Release ownership when net_tx_packet_done_valid reports local serial completion
      of the packet's EOP/EEP. EOP/EEP acceptance into the DataLink FIFO and
      Encoding commit are earlier boundaries and do not by themselves free the output.
    timeout_release: >
      On Router timeout, retain ownership until net_tx_abort_done reports completion
      of the synthetic EEP, unless a qualified link error terminates the packet first.
    link_error_release: >
      net_tx_link_abort_valid terminates the current output packet ownership. The
      output is not considered free for a new packet until net_tx_new_packet_ready
      later reasserts after recovery.
    port_free_definition: "!owner_valid && net_tx_new_packet_ready"
    rationale: >
      This directly separates SpaceWire wormhole packet ownership from FIFO capacity
      and prevents a following packet from entering the output while the previous
      packet is still being transmitted.
  multicast_transfer:
    all_ready: every_selected_output_can_accept_same_NChar
    fire: head_valid_and_all_ready
    all_outputs_receive_same_kind_and_data: true
    subset_handshake_forbidden: true
    unresolved: >
      A conventional per-output stable-valid interface must not accept a subset.
      Define a group acceptance/reservation adapter or justify simultaneous gated
      valid with DataLink ready independent of valid. NR-TECH-04.
  disabled_output:
    at_packet_start: omit_disabled_multicast_ports_per_selected_SHOULD
    mid_packet: NR-DEC-02
  progress_tracking:
    passed_to_output: "net_tx_nchar_valid && net_tx_nchar_ready"
    encoding_commit: distinct_later_DataLink_accounting_event
    local_serial_complete: distinct_later_Encoding_completion_event
    packet_context: one_active_Router_packet_per_output
    timeout_start: first_DATA_passed_to_output
    timeout_end: EOP_or_EEP_passed_to_output
    ownership_end: normal_terminal_local_serial_complete_or_abort_termination

timeout:
  references: [5.6.8.12, CR-RTR-001]
  inherited: configurable_per_port_and_disable_supported
  implementation_choice:
    counter_per_output: true
    timebase: 100MHz_core_cycles
    counter_width_bits: 32
    counter_type: saturating
    reset_default_enable: false
    period_register_unit: core_cycles
  normative_measurement: time_since_last_DATA_passed_from_input_port_to_output_port
  activity_window:
    starts: first_DATA_passed_to_output
    ends: EOP_or_EEP_passed_to_output
    passed_to_output_event: "net_tx_nchar_valid && net_tx_nchar_ready"
  progress_rule:
    DATA_handshake: "reset idle-cycle counter to zero"
    terminal_handshake: "end timeout monitoring for this packet"
    no_progress: "increment saturating idle-cycle counter"
  expiry:
    comparison: strictly_greater_than_configured_period
    same_edge_precedence: >
      A DATA progress handshake or EOP/EEP terminal handshake on the sampling edge
      suppresses timeout expiry on that edge. PortReset/RouterReset and qualified
      link error also dominate timeout generation.
  action:
    - latch_stuck_packet_error_for_output_port
    - stop_normal_input_to_output_forwarding_for_the_affected_packet
    - assert_net_tx_abort_valid_reason_ROUTER_TIMEOUT_until_accepted
    - drain_original_input_tail_locally_through_first_EOP_or_EEP
    - wait_for_net_tx_abort_done_or_link_error_termination
    - release_output_ownership_then_wait_for_net_tx_new_packet_ready
  DataLink_abort_contract:
    association: implicit_current_output_packet
    packet_tag: not_required_in_v0_1
    reason: >
      Wormhole ownership permits only one active Router packet per output and
      no following packet may start before completion/termination.
    output_remainder: >
      DataLink resolves any accepted-uncommitted current-packet N-Char, discards
      the unsent buffered remainder, and issues one synthetic EEP.
    synthetic_EEP: >
      Uses normal DataLink N-Char credit accounting and Encoding path. It is not
      allowed to bypass tx_credit.
    completion: >
      net_tx_abort_done occurs only after the synthetic EEP completes local serial
      emission. A later qualified link error supersedes the timeout abort and
      prevents a duplicate timeout EEP.
  upstream_tail: >
    Router discards the original input remainder through its first EOP/EEP without
    forwarding it to the timed-out output. The following packet is not consumed or
    reframed as part of the timed-out packet.
  multicast_scope: >
    This closes unicast/per-output timeout semantics. How one timed-out member of
    an active multicast set affects the remaining members is deferred to NR-TECH-04.
  unresolved: []

broadcast:
  references: [5.6.3, 5.6.4.6, 5.6.4.7, 5.6.5.5, 5.6.5.7]
  event_capture: all_per_port_DataLink_event_valid_inputs_in_same_cycle
  priority: [TIME_CODE, INTERRUPT_ACK, INTERRUPT]
  reserved_types: delete_without_relay
  timecode:
    register_bits: 6
    valid: received_equals_previous_plus_one_modulo_64
    valid_action: update_and_relay_except_ingress
    invalid_action: update_without_relay
  interrupt:
    IID_bits: 5
    active_bits: 32
    timers: one_per_IID
    inactive_interrupt: set_bit_relay_start_timer
    active_interrupt: discard_duplicate
    active_ack: clear_bit_relay_stop_and_reset_timer
    inactive_ack: ignore
    timeout: clear_bit
    per_port_masks: [interrupt_rx, interrupt_tx, ack_rx, ack_tx]
  proposed_collision_order: >
    Capture all arrivals first. Establish deterministic processing of same-cycle
    events against shared state; ACK/interrupt/timeout on one IID and multiple
    time-codes need explicit precedence, golden event serialization and tests.
  capacity: >
    No-backpressure reception does not imply unbounded storage. Derive event burst,
    aggregate arrival and per-egress service bounds before selecting FIFO depths.
    Silent overwrite/coalescing or unrestricted lossless relay is not assumed.
  DataLink_priority_dependency: >
    A lower-priority BC already accepted by the one-entry DataLink pending register
    cannot be preempted by a newly arrived time-code. Define the actual Network
    arbitration/transfer boundary; acceptance-order priority is not automatically
    next-character wire priority.
  unresolved: [NR-DEC-03, NR-TECH-03]

configuration:
  port0_path_only: true
  required_access: [routing_table, per_port_status, per_port_timeout, interrupt_parameters]
  application_protocol: unresolved_NR_DEC_03
  proposal: >
    Port-0 packet service plus a documented configuration application/CSR adapter.
    Do not assume RMAP is required by this ECSS contract, and do not substitute
    AXI-only access for the required port-0 access.
  safety: no_torn_entry_updates_and_no_midpacket_route_change
  reset_values: logical_entries_invalid_adaptive_and_multicast_disabled
  remaining: register_map_transaction_schema_reset_and_write_collision_rules

