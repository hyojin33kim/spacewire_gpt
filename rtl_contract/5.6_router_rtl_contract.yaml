    - disjoint_outputs_concurrent_and_adaptive_contention
    - multicast_one_sink_stalled_no_subset_handshake
    - multicast_port_failure_midpacket
    - long_packet_with_FIFO_empty_bubbles_and_recovery
    - timeout_at_threshold_and_threshold_plus_one
    - timeout_with_TX_FIFO_backlog_and_following_packet
