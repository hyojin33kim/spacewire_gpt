  scoreboard: >
    Compare ordered semantic events and per-packet payload/end status using the
    implementation-independent Golden model. Do not compare arbitrary cycle
    latency or exact fair-scheduler winner identity. Adapter must expose any
    assumed event order and may not hide dropped, duplicated or late events.
  review_pass: >
    All 101 Router requirements dispositioned; decisions approved; technical
    blockers closed; contract lint and targeted boundary model checks pass.
    No claims of RTL verification until separately authorized RTL exists.
