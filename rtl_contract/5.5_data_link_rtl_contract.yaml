schema_version: 1
artifact_id: RTL-CONTRACT-DATALINK-V0.1
semantic_baseline: semantic-datalink-v0.1.1
semantic_contract: contracts/5.5_data_link.yaml
golden_validation: traceability/golden_validation_datalink_v0.1.1.yaml
feature_profile: GOLDEN-FULL-REFERENCE-V0.1
status: reviewed
purpose: >
  Convert the validated Data Link semantics into cycle-level RTL obligations
  while preserving the Golden Model as an implementation-independent oracle.
  This contract fixes the Data Link core I/O, storage ownership, handshake,
  reset, timing and recovery rules. RTL implementation remains prohibited
  until the blocking interface decisions are closed and this contract is reviewed.

source_scope:
  normative:
    - "ECSS-E-ST-50-12C Rev.1 5.2.3"
    - "ECSS-E-ST-50-12C Rev.1 5.2.8"
    - "ECSS-E-ST-50-12C Rev.1 5.5.2 through 5.5.9"
    - "ECSS-E-ST-50-12C Rev.1 6.2"
  repository:
    - requirements/5.2.3_data_link_architecture.yaml
    - requirements/5.5_data_link.yaml
    - requirements/6.2_data_link_service.yaml
    - contracts/5.5_data_link.yaml
    - golden_model/data_link/model.py
    - verification/pre_golden/5.5_data_link_vectors.yaml
    - verification/pre_golden/5.5_data_link_invariants.yaml

implementation_profile:
  intent: flight_fpga
  instance_granularity: one_DataLink_instance_per_SpaceWire_port
  core_clock_hz: 100000000
  core_clock_period_ns: 10
  core_domain: spw_core_clk
  encoding_core_interface_domain: spw_core_clk
  maximum_credit: 56
  credit_quantum: 8
  legacy_LinkDisabled_behavior: disabled
  discard_broadcast_unless_Run: enabled
  recommended_status_information: enabled

module_partition:
  required_logical_blocks:
    - spw_datalink_ctrl
    - spw_datalink_tx_scheduler
    - spw_datalink_credit_mgr
    - spw_datalink_tx_fifo
    - spw_datalink_rx_fifo
    - spw_datalink_recovery
  note: >
    These are logical ownership boundaries. They may be merged physically in RTL
    provided the externally observable contract and verification points remain intact.

network_to_datalink_tx_nchar:
  handshake: valid_ready
  signals:
    - net_tx_nchar_valid
    - net_tx_nchar_ready
    - net_tx_nchar_kind
    - net_tx_nchar_data_7_0
  nchar_kind: [DATA, EOP, EEP]
  acceptance:
    normal_mode: "accept on rising edge when valid && ready"
    normal_ready: "!PortReset && Recovery==Normal && tx_fifo_not_full"
    outside_Run: >
      N-Chars may be queued in the TX FIFO before Run; they shall not be passed
      to Encoding until the Link FSM is in Run. This is an implementation choice
      consistent with the port TX FIFO storing N-Chars until they can be sent.
    recovery_discard_exception: >
      If an error occurs while a packet is open, the Data Link owns the recovery
      drain. After any already-buffered remainder is discarded, it shall continue
      accepting the remainder of that same upstream packet through EOP/EEP and
      discard those accepted N-Chars directly without writing them into the TX FIFO.
      No recovery-drained N-Char shall be transmitted on the recovering link.
  packet_order: preserve
  interface_reason: >
    Implements 5.5.2.e and 6.2 SEND_NCHAR while allowing 5.5.8.4 packet-spill
    recovery to complete even when the full packet was not already buffered.

datalink_to_network_tx_packet_status:
  signals:
    - net_tx_new_packet_ready
    - net_tx_packet_done_valid
    - net_tx_packet_done_kind
    - net_tx_link_abort_valid
  semantics:
    net_tx_new_packet_ready: >
      Packet-level permission for a Router/Network owner to start a new packet
      on this output. It is distinct from per-N-Char net_tx_nchar_ready and shall
      be low while a Router packet is active, while a Router-timeout abort is
      active, or while link-error recovery prevents a new packet from starting.
    net_tx_packet_done_valid: >
      One-cycle pulse when the EOP/EEP that terminates the active Router packet
      completes serial emission according to enc_tx_complete feedback.
    net_tx_packet_done_kind: [EOP, EEP]
    net_tx_link_abort_valid: >
      One-cycle indication that an active output packet has been terminated by
      a qualified link error rather than by normal EOP/EEP completion. The Router
      may release packet ownership, but the port is not eligible for a new packet
      until net_tx_new_packet_ready is asserted again.

network_to_datalink_tx_abort:
  handshake: valid_ready
  signals:
    - net_tx_abort_valid
    - net_tx_abort_ready
    - net_tx_abort_reason
  reason: [ROUTER_TIMEOUT]
  acceptance: >
    Accept only while a Router packet is active, Link FSM is in Run, Recovery is
    Normal, and no prior Router abort is active. PortReset or a qualified link
    error on the same edge dominates and prevents Router-abort acceptance.
  packet_association: >
    v0.1 carries no packet tag because Router ownership permits at most one
    active Router packet per output and net_tx_new_packet_ready forbids starting
    the next packet before completion/termination of the current one.
  completion:
    signal: net_tx_abort_done
    definition: >
      Pulse when the synthetic EEP generated for the accepted timeout abort has
      completed serial emission. This is the Router's abort-completion event.

network_to_datalink_tx_broadcast:
  handshake: valid_ready
  signals:
    - net_tx_bc_valid
    - net_tx_bc_ready
    - net_tx_bc_value_7_0
  behavior:
    Run: "accept into one-entry pending register when empty"
    not_Run: "accept request and discard immediately; never defer until a later Run state"
    pending_full: "deassert ready until the pending broadcast is committed to Encoding"
  storage: one_entry_pending_register
  priority: highest_at_next_character_boundary

datalink_to_network_rx_nchar:
  handshake: valid_ready
  signals:
    - net_rx_nchar_valid
    - net_rx_nchar_ready
    - net_rx_nchar_kind
    - net_rx_nchar_data_7_0
  source: rx_fifo_head
  pop_condition: "valid && ready on rising edge"
  availability: independent_of_current_link_state
  reason: >
    Previously received N-Chars, including a recovery-inserted EEP, remain readable
    while the link is being re-initialised.

datalink_to_network_rx_broadcast:
  handshake: event_valid
  signals:
    - net_rx_bc_valid
    - net_rx_bc_value_7_0
  contract:
    valid_width_cycles: 1
    backpressure: none
    sink_obligation: "Network-side owner shall capture each event in the same core cycle"
  reason: >
    Broadcast codes are not protected by N-Char flow control. The Network ownership
    contract shall provide a sink that accepts each Data Link broadcast indication.

datalink_to_encoding_tx:
  handshake: valid_ready_plus_commit_feedback
  request_signals:
    - enc_tx_item_valid
    - enc_tx_item_ready
    - enc_tx_item_kind
    - enc_tx_item_data_7_0
  item_kind: [DATA, EOP, EEP, FCT, NULL, BROADCAST_CODE]
  prohibited_request_kind:
    - raw_ESC
  raw_ESC_owner: Encoding_internal_only
  acceptance: "request accepted on valid && ready"
  ready_semantics: >
    enc_tx_item_ready is not a generic buffer-space indication. It shall assert
    only at a next-item selection opportunity after the current character/control
    code has finished, when Encoding can reserve exactly one next protocol item.
    Data Link performs BC > FCT > NChar > Null arbitration at that acceptance
    edge. A higher-priority request arriving after that edge belongs to the next
    selection opportunity.
  commit_feedback_required:
    - enc_tx_commit_valid
    - enc_tx_commit_kind
  completion_feedback_required:
    - enc_tx_complete_valid
    - enc_tx_complete_kind
  pending_cancel_interface:
    request: enc_tx_cancel_pending
    acknowledge: enc_tx_cancel_ack
    scope: accepted_uncommitted_NChar_of_current_packet_only
    precedence: "matching commit on the same edge wins; otherwise cancel ack resolves the pending item"
  accept_definition: >
    valid && ready accepts one protocol item for Encoding transmission but does
    not mean that the item has been sent. For FIFO-backed N-Chars the selected
    FIFO head becomes reserved and unavailable to the scheduler until commit or
    an explicit pre-commit flush resolution.
  commit_definition: >
    Pulse when Encoding irrevocably consumes the accepted item as the next serial
    character/control-code at a character/control-code boundary. Commit is not
    wire-transmission completion.
  same_edge_accept_commit:
    allowed: true
    rule: >
      If accept and matching commit occur on the same rising edge, the item is
      committed directly and never remains in accepted-uncommitted state.
  pending_rule:
    max_accepted_but_uncommitted_items: 1
    while_pending: "enc_tx_item_ready shall be deasserted"
    pending_metadata: [valid, kind]
    pending_is_terminator: "derived from pending kind == EOP or EEP; not an independent sticky state"
    rationale: >
      The Data Link scheduler must re-evaluate BC > FCT > NChar > Null at every
      character boundary. Deeper in-order protocol-item prefetch could prevent a
      newly arrived higher-priority item from winning the next boundary.
  commit_order: preserve_accept_order
  commit_safety:
    - commit_requires_matching_same_edge_accept_or_prior_pending_accept
    - no_duplicate_commit
    - accepted_item_kind_equals_committed_item_kind
  nchar_fifo_reservation:
    accept_without_same_edge_commit: "reserve TX FIFO head; do not pop"
    while_reserved: "head remains immutable and shall not be re-issued or skipped"
    matching_commit: "pop exactly one reserved TX FIFO entry on the commit edge"
    same_edge_accept_commit: "pop exactly one selected TX FIFO entry on that edge"
    accounting: "no tx_credit or tx_packet_open update on accept alone"
  same_cycle_link_error_precedence:
    rule: >
      A matching commit asserted on the error-entry edge is irrevocable and is
      accounted first. Link/Recovery error handling then uses the post-commit
      tx_packet_open state. If no commit is asserted, the accepted-uncommitted
      item is resolved by the pre-commit flush rules.
  semantic_use_of_commit:
    - TX_NChar_commit_decrements_tx_credit
    - FCT_commit_increments_rx_credit
    - NULL_commit_generates_sentNull
    - FCT_commit_generates_sentFCT
    - BROADCAST_CODE_commit_clears_pending_broadcast
  ordering: preserve_request_order

encoding_to_datalink_rx:
  handshake: event_valid_no_backpressure
  signals:
    - enc_rx_item_valid
    - enc_rx_item_kind
    - enc_rx_data_7_0
    - enc_got_null
    - enc_disconnect
    - enc_rx_error_valid
    - enc_rx_error_kind
  item_kind: [DATA, EOP, EEP, FCT, BROADCAST_CODE]
  sink_obligation: >
    Data Link shall consume every Encoding receive event in the cycle presented.
    N-Char loss due to local FIFO full is forbidden by the credit contract.
  rx_error_kind: [PARITY_ERROR, ESC_ERROR]
  qualification:
    disconnect: "Encoding contract shall not assert before disconnect is armed by the first D/S transition"
    receive_error_and_received_items: "shall be semantically effective only after gotNull"
  defensive_assertions:
    - no_NChar_or_BC_delivery_before_gotNull
    - no_FCT_condition_before_gotNull

fifo_contract:
  tx_fifo:
    content: NCHAR_only
    entry_fields: [kind_2b, data_8b]
    depth_entries: 128
    depth_status: confirmed_v0_1_architecture_choice
    PortReset_action: clear
    dequeue_contract:
      accept: "reserve selected head; no pop unless matching commit is same-edge"
      commit: "pop exactly one matching reserved/selected N-Char"
      level_semantics: "physical occupancy includes an accepted-but-uncommitted reserved head"
      reservation_blocks_reissue: true
    precommit_flush_resolution:
      packet_closed: >
        Cancel the reservation and retain the N-Char in the TX FIFO for retry
        after link re-initialisation. This covers a first DATA or empty-packet
        terminator that was accepted but never committed.
      packet_open: >
        The reserved N-Char belongs to the unsent remainder of the current packet.
        Discard it exactly once. If it is EOP/EEP, that discard terminates the
        TX recovery spill; otherwise continue discarding through the first EOP/EEP.
      non_FIFO_item: >
        Flush pending FCT/NULL/BROADCAST_CODE without FIFO action or commit-side
        accounting.
    recovery_behavior: >
      When a transmitted packet is open at error entry, discard queued entries
      through and including the first EOP or EEP belonging to that packet.
      Preserve any subsequent complete packet already buffered after that terminator.
  rx_fifo:
    content: NCHAR_only
    entry_fields: [kind_2b, data_8b]
    depth_entries: 128
    depth_status: confirmed_v0_1_architecture_choice
    PortReset_action: clear
    minimum_for_selected_credit_profile: 56
    recovery_behavior: >
      If recovery requires an EEP and the FIFO is full, keep EEP pending until
      space becomes available, then write the EEP before declaring Recovery complete.
  recovery_direct_drain:
    owner: DataLink
    activation: >
      Current TX packet is open, Recovery is active, and the terminator for that
      current packet was not found in the buffered TX FIFO remainder.
    upstream_handshake: valid_ready
    ready_behavior: >
      Assert net_tx_nchar_ready while waiting for the current packet terminator.
      Upstream is required to continue the already-started packet without N-Char
      interleaving and eventually provide EOP or EEP; this liveness obligation is
      carried into the Network Ownership & Interface Contract.
    data_behavior: "accepted DATA is discarded immediately and is not written to TX FIFO"
    terminator_behavior: >
      Accepted EOP or EEP is discarded and completes the TX recovery drain.
      Deassert recovery-drain readiness before any next-packet N-Char can be accepted.
    fifo_interaction:
      - discard_existing_current_packet_entries_from_TX_FIFO_first
      - stop_FIFO_discard_at_first_EOP_or_EEP
      - preserve_entries_after_that_terminator_as_following_packet_data
      - if_FIFO_empties_before_terminator_switch_to_direct_drain
    safety:
      - never_store_direct_drain_items_in_TX_FIFO
      - never_forward_direct_drain_items_to_Encoding
      - never_consume_first_item_of_following_packet
    rationale: >
      Packet length is not bounded by the 128-entry FIFO. Direct drain therefore
      avoids recovery deadlock and avoids write/read traffic for data that is
      known to be discarded.

  broadcast_storage:
    tx: separate_one_entry_register_not_in_TX_FIFO
    rx: not_stored_in_NChar_RX_FIFO

router_timeout_abort_engine:
  classification: network_layer_timeout_support_without_link_reset
  states: [IDLE, RESOLVE_PENDING, DISCARD_BUFFERED, ISSUE_EEP, WAIT_EEP_COMPLETE]
  entry: "accepted net_tx_abort_valid && net_tx_abort_ready"
  entry_actions:
    - block_normal_net_tx_nchar_acceptance_for_this_output
    - latch_abort_reason_ROUTER_TIMEOUT
    - keep_LinkFSM_and_rx_path_operational
  pending_resolution: >
    If an accepted-but-uncommitted FIFO-backed N-Char of the active packet exists,
    assert enc_tx_cancel_pending. A same-edge matching commit wins and is accounted;
    otherwise enc_tx_cancel_ack allows the reserved FIFO entry to be discarded.
    Pending FCT/NULL/BROADCAST_CODE is not canceled by Router timeout.
  buffered_remainder: >
    Discard all unsent FIFO-backed N-Chars belonging to the active Router packet.
    Under the Router packet-level ownership contract no following Router packet
    can already be queued on this output, so no packet tag is required for v0.1.
  synthetic_EEP:
    source: dedicated_abort_EEP_pending
    fifo_storage: false
    scheduler_class: NCHAR
    prerequisites:
      - LinkFSM_is_Run
      - Recovery_is_Normal
      - tx_credit_greater_than_zero
      - no_accepted_uncommitted_external_item
    accounting:
      - EEP_commit_decrements_tx_credit
      - EEP_commit_clears_tx_packet_open
      - EEP_completion_generates_net_tx_packet_done_valid_kind_EEP
      - EEP_completion_generates_net_tx_abort_done
    credit_bypass: forbidden
  link_error_collision: >
    If a qualified link error occurs before synthetic EEP completion, link-error
    recovery supersedes the Router-abort engine. No duplicate timeout EEP is sent;
    net_tx_link_abort_valid terminates Router ownership and new-packet permission
    remains low until normal link recovery permits it.
  reset_priority:
    - PortReset_or_external_reset
    - qualified_link_error
    - Router_timeout_abort
    - normal_TX_operation

router_packet_output_tracking:
  active_set: "first DATA accepted from Network/Router while no Router packet active"
  active_clear:
    - matching_EOP_or_EEP_enc_tx_complete
    - synthetic_abort_EEP_enc_tx_complete
    - qualified_link_error_terminates_active_output_packet
    - PortReset
  distinction: >
    router_packet_active tracks output-port packet ownership through local serial
    transmission completion. It is deliberately distinct from tx_packet_open,
    which tracks commit-level Data Link recovery state.
  new_packet_ready_rule: >
    Assert net_tx_new_packet_ready only when router_packet_active is false,
    Router-timeout abort is idle, link-error Recovery permits a new packet, and
    the normal Network-to-DataLink acceptance path has capacity.

credit_contract:
  counter_width_bits: 6
  tx_credit:
    range: [0, 56]
    reset_value: 0
    decrement_event: TX_NChar_commit
    increment_event: RX_FCT_event
    increment_amount: 8
    overflow: CreditError
  rx_credit:
    range: [0, 56]
    reset_value: 0
    decrement_event: RX_NChar_event
    increment_event: TX_FCT_commit
    increment_amount: 8
    underflow: CreditError
  FCT_request_condition:
    all:
      - "rx_fifo_free_entries >= rx_credit + 8"
      - "rx_credit <= 48"
    behavior: >
      rx_credit is outstanding receive authorization and therefore reserves FIFO
      capacity. Re-evaluate after each credit/FIFO update. In Connecting and Run,
      request FCT whenever at least eight additional unreserved slots exist and
      the scheduler allows it.
  same_cycle_event_rules:
    tx_credit:
      - "TX_NChar_commit legality is checked against pre-cycle tx_credit > 0"
      - "apply TX_NChar_commit decrement before applying a same-cycle RX_FCT increment"
      - "then RX_FCT is a CreditError if resulting credit + 8 would exceed 56"
    rx_credit:
      - "RX_NChar legality is checked against pre-cycle rx_credit > 0"
      - "apply RX_NChar decrement, then apply a same-cycle TX_FCT_commit increment"
      - "a same-cycle newly sent FCT shall not legalise an N-Char received with pre-cycle rx_credit == 0"

tx_scheduler:
  decision_point: >
    Re-evaluate priority whenever there is no accepted-but-uncommitted Encoding
    item and Encoding asserts ready for a new acceptance. Semantic send/accounting
    occurs later on commit feedback.
  state_behavior:
    ErrorReset: none
    ErrorWait: none
    Ready: none
    Started: [NULL]
    Connecting: [FCT, NULL]
    Run: [BROADCAST_CODE, FCT, NCHAR, NULL]
  Run_priority:
    - BROADCAST_CODE
    - FCT
    - NCHAR
    - NULL
  NChar_enable:
    common:
      - "tx_credit > 0"
      - "Recovery == Normal"
    sources_in_order:
      - "router_timeout_abort_EEP_pending"
      - "normal_TX_FIFO_head_when_not_router_abort_active"
  recovery_note: >
    Link re-initialisation may proceed while TX packet spill is still active.
    FCT/Null and broadcast operation may continue according to link state, but no
    new packet N-Char may be transmitted until Recovery returns to Normal.

link_fsm_contract:
  states: [ErrorReset, ErrorWait, Ready, Started, Connecting, Run]
  implementation: registered_Moore_state
  state_update_edge: rising_spw_core_clk
  outputs_change: "immediately after the state update edge"
  transition_priority:
    - PortReset
    - LinkDisabled_or_qualified_link_error
    - protocol_illegal_receive_condition
    - nominal_handshake_transition
    - state_timer_expiry
  error_dominance: true
  state_outputs:
    ErrorReset: {tx_enable: false, rx_enable: false}
    ErrorWait: {tx_enable: false, rx_enable: true, store_rx_nchar: false, deliver_rx_bc: false}
    Ready: {tx_enable: false, rx_enable: true, store_rx_nchar: false, deliver_rx_bc: false}
    Started: {tx_enable: true, rx_enable: true, tx_allowed: [NULL], store_rx_nchar: false, deliver_rx_bc: false}
    Connecting: {tx_enable: true, rx_enable: true, tx_allowed: [FCT, NULL], store_rx_nchar: false, deliver_rx_bc: false}
    Run: {tx_enable: true, rx_enable: true, tx_allowed: [BROADCAST_CODE, FCT, NCHAR, NULL], store_rx_nchar: true, deliver_rx_bc: true}
  conditions:
    ErrorReset_to_ErrorWait: "!LinkDisabled && timer_6_4us_elapsed"
    ErrorWait_to_Ready: "timer_12_8us_elapsed"
    Ready_to_Started: "LinkStart || (AutoStart && gotNull)"
    Started_to_Connecting: "sentNull && gotNull"
    Connecting_to_Run: "sentFCT && gotFCT"
  timing_qualification:
    disconnect: only_after_Encoding_qualified_disconnect
    parity_ESC_gotFCT_gotNChar_gotBC: only_after_gotNull
  note: >
    Error-dominant ordering is an RTL determinisation for simultaneous core-cycle
    conditions; it shall not suppress any normative error transition.

timer_contract:
  implementation_clock_hz: 100000000
  timer_reference: measured_from_state_entry
  error_reset_delay:
    nominal_us: 6.4
    allowed_us: [5.82, 7.22]
    selected_cycles: 640
    exact_rule: "expire on the 640th rising edge after state entry"
  state_timeout:
    nominal_us: 12.8
    allowed_us: [11.64, 14.33]
    selected_cycles: 1280
    exact_rule: "expire on the 1280th rising edge after state entry"
  counter_reset: on_each_relevant_state_entry

error_recovery_contract:
  states: [Normal, Recovery]
  entry:
    - "Run && LinkDisabled"
    - "Run && Disconnect"
    - "Run && ParityError"
    - "Run && ESCError"
    - "Run && CreditError"
  actions:
    tx:
      - detect_whether_packet_was_open_at_error
      - discard_buffered_current_packet_remainder_through_EOP_or_EEP
      - preserve_any_TX_FIFO_entries_after_the_current_packet_terminator
      - if_terminator_not_buffered_enter_direct_drain_bypass
      - direct_drain_accepts_and_discards_without_TX_FIFO_write
      - direct_drain_completes_on_first_EOP_or_EEP
      - do_not_accept_or_discard_following_packet_after_current_packet_terminator
    rx:
      - "if last N-Char written to RX FIFO was DATA, append EEP"
      - "if EEP is pending and RX FIFO full, wait for space"
      - "reference implementation does not add optional extra EEP after EOP/EEP"
    status:
      - latch_all_error_causes_present_on_recovery_entry
      - expose_current_error_flags_separately_from_latched_recovery_cause_flags
  completion: >
    Recovery returns to Normal only after TX spill/discard is complete and any
    required RX EEP has been written.
  concurrency: >
    Recovery FSM and Link initialisation FSM operate concurrently. Reaching Run
    does not by itself complete Recovery.

reset_contract:
  external_reset:
    policy: async_assert_sync_deassert_in_spw_core_clk_domain
  PortReset:
    sampling: synchronous_management_input
    actions:
      - clear_TX_FIFO
      - clear_RX_FIFO
      - clear_pending_broadcast
      - set_LinkFSM_ErrorReset
      - set_RecoveryFSM_Normal
      - clear_tx_credit
      - clear_rx_credit
      - clear_gotFCT
      - clear_packet_open_tracking
      - clear_pending_recovery_EEP
      - clear_current_and_latched_error_status
  LinkDisabled:
    action: force_or_hold_LinkFSM_ErrorReset
    FIFO_policy: "does not itself clear TX/RX FIFOs; PortReset does"
  encoding_control:
    signals:
      - enc_tx_enable
      - enc_rx_enable
      - enc_link_left_error_reset
      - enc_link_rate_setting
    tx_enable_rx_enable: derived_from_LinkFSM_state
    enc_link_left_error_reset: "one-cycle pulse on ErrorReset -> ErrorWait transition"
    enc_link_rate_setting: "initial rate outside Run; configured operational rate in Run"

packet_completion_events:
  normal_terminal: >
    A committed EOP/EEP closes tx_packet_open, but Router packet ownership remains
    active until the matching enc_tx_complete_valid event confirms local serial
    emission completion.
  router_timeout_terminal: >
    Synthetic EEP commit performs normal N-Char accounting; matching EEP completion
    generates both net_tx_packet_done_valid and net_tx_abort_done.
  wire_scope: >
    Completion means the final symbol bits have been launched by the local
    transmitter; it is not acknowledgement of remote reception.

packet_tracking:
  tx_packet_open:
    set_on: "TX_DATA_commit when previously closed"
    clear_on:
      - TX_EOP_or_EEP_commit
      - recovery_discards_current_packet_EOP_or_EEP
    error_entry_basis: >
      Evaluate TX recovery spill after applying any same-edge irrevocable commit.
      Therefore EOP/EEP commit on the error-entry edge closes the packet before
      spill determination, while an accepted-but-uncommitted terminator is handled
      by pre-commit flush/discard.
    purpose: recovery_remainder_discard
  rx_packet_open:
    set_on: "RX_DATA_written_to_RX_FIFO when previously closed"
    clear_on: "RX_EOP_or_EEP_written_to_RX_FIFO"
    purpose: recovery_EEP_insertion
  note: >
    N-Chars from different packets shall never be interleaved. Recovery discard
    stops exactly at the current packet terminator and shall never consume the
    first item of the following packet.

