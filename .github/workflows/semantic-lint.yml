name: Semantic Lint

on:
  push:
    branches:
      - main
    paths:
      - "ontology/**"
      - "requirements/**"
      - "contracts/**"
      - "verification/**"
      - "traceability/**"
      - "rtl_contract/**"
      - "tools/semantic_lint.py"
      - ".github/workflows/semantic-lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ontology/**"
      - "requirements/**"
      - "contracts/**"
      - "verification/**"
      - "traceability/**"
      - "rtl_contract/**"
      - "tools/semantic_lint.py"
      - ".github/workflows/semantic-lint.yml"

jobs:
  semantic-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run semantic structural lint
        run: python tools/semantic_lint.py
