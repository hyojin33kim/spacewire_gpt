name: Golden Model Validation

on:
  push:
    paths:
      - "golden_model/**"
      - "verification/golden/**"
      - "verification/pre_golden/**"
      - "tools/golden_coverage_lint.py"
      - "tools/golden_invariant_coverage_lint.py"
      - ".github/workflows/golden-model.yml"
  pull_request:
    paths:
      - "golden_model/**"
      - "verification/golden/**"
      - "verification/pre_golden/**"
      - "tools/golden_coverage_lint.py"
      - "tools/golden_invariant_coverage_lint.py"

jobs:
  protocol-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run protocol Golden Model tests
        run: python -m unittest discover -s verification/golden -p "test_*.py" -v
      - name: Check pre-Golden vector coverage closure
        run: python tools/golden_coverage_lint.py
      - name: Check pre-Golden invariant coverage closure
        run: python tools/golden_invariant_coverage_lint.py
