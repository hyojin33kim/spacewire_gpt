schema_version: 1
spec: ECSS-E-ST-50-12C-Rev.1
artifact: interpretation decisions
status: active

decisions:
  - id: DEC-ENC-001
    date: "2026-09-18"
    issue: CR-ENC-008
    source_clause: "6.3.2.6.4"
    source_text_reference: "state machine of clause 5.5.6"
    observation:
      - "5.5.6 is Sending priority."
      - "Link initialisation behaviour/state machine is 5.5.7 / Figure 5-19."
    decision: >
      Interpret the intended behavioral reference for gotNull.indication as
      clause 5.5.7 / Figure 5-19. Preserve the original 6.3.2.6.4 wording in
      evidence and record this as an explicit interpretation; do not silently
      rewrite the source standard.
    approved_by: user
    effect_on_golden_model: gotNull_event_follows_link_initialisation_behavior_boundary
    effect_on_rtl_contract: no_direct_cycle_semantics_implied
    status: accepted

  - id: DEC-ENC-002
    date: "2026-09-18"
    issue: CR-ENC-012
    source_clause: "5.4.4.e"
    observation:
      - "The source says the delay is between 500 ns and the period of the fastest transmit time."
      - "500 ns is explicitly the bit period at the slowest permitted 2 Mbps rate."
      - "The fastest supported transmit period is therefore the shorter endpoint for a normal implementation."
    decision: >
      Represent the requirement as an unordered endpoint constraint in source evidence,
      and semantically as T_fastest <= reset_inter_signal_delay <= 500 ns.
      The exact clock-cycle realization is not protocol semantics and is deferred to
      the mandatory RTL Contract.
    approved_by: engineering_review_under_user_go_authorization
    status: accepted

  - id: DEC-ENC-003
    date: "2026-09-18"
    source_clauses: ["5.2.4.a.2", "5.4.4.a", "3.2.33"]
    decision: >
      The Golden Model shall model only the observable Data-Strobe decoding semantic:
      a valid DS waveform recovers the original serial bit stream. No XOR, edge-detector,
      synchronizer, or flip-flop implementation is implied by the semantic baseline.
    classification: semantic_vs_microarchitecture_boundary
    status: accepted
