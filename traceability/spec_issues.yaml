  - id: CR-DL-001
    source_clauses: ["5.5.2.a", "5.5.2.b", "5.5.2.c", "5.5.2.d", "5.5.7.7.a.1", "5.5.7.7.a.3", "5.5.7.7.a.4"]
    source_statement_summary: >
      The Data Link layer is bidirectional. Network-originated N-Chars and broadcast
      codes are transmitted toward Encoding, while link-originated characters/control
      codes are received from Encoding and delivered upward as N-Chars/broadcast codes.
      In Run, 5.5.7.7.a.3 uses the phrase "received N-Chars and broadcast codes" and
      directs them to the Encoding Layer.
    observed_ambiguity: >
      Broadcast codes are valid in both directions, so their inclusion in 5.5.7.7.a.3
      is not by itself contradictory. The remaining ambiguity is specifically the
      provenance of the word "received" for N-Chars: received from the Network service
      for transmission, or received from Encoding/link for delivery upward.
    candidate_interpretation: >
      Preserve 5.5.7.7.a.3 literally unless stronger evidence shows an editorial error.
      Treat Network-originated N-Chars/broadcast codes as TX traffic passed to Encoding;
      treat Encoding-originated N-Chars/broadcast codes as RX traffic passed to Network.
      The Golden Model shall keep TX and RX service events directionally typed so the
      same term cannot silently collapse the two directions.
    decision_required: false
    blocking: false
    status: clarified_directional_semantics

  - id: CR-DL-002
    source_clause: "5.5.8.4.b.1"
    source_statement_summary: >
      Recovery exits when all error recovery actions "listed in 5.5.8.4.b" are complete,
      although the action list immediately preceding it is in 5.5.8.4.a; the phrase
      "move to the Normal state" is also duplicated.
    observed_conflict: editorial_self_reference_and_duplicate_phrase
    handling: preserve_source_wording_and_use_the_immediately_preceding_5.5.8.4.a_action_list
    decision_required: false
    blocking: false
    status: documented_source_issue
