  - id: CR-ENC-015
    source_clauses: ["5.4.2.a", "5.5.2.b", "6.3.1.2"]
    source_statement_summary: >
      5.4.2/5.5.2 explicitly transfer characters and control codes between Data Link
      and Encoding, while TX_CHAR.request in 6.3 carries a Character parameter.
    observed_conflict: "Control-code transfer is not explicitly represented by the TX_CHAR.request parameter type."
    handling: "RTL contract uses a tagged union item interface while preserving the source primitive evidence."
    decision_required: false
    blocking: false
    status: documented_interface_mismatch

  - id: CR-ENC-016
    source_clauses: ["5.4.2.b", "5.5.2.c", "6.3.2.2"]
    source_statement_summary: >
      5.4.2/5.5.2 require received characters and control codes to pass to Data Link,
      while RX_CHAR.request effect text refers to a decoded character and its parameter
      notation is incomplete.
    observed_conflict: "Control-code receive representation is not explicit in the service primitive."
    handling: "RTL contract uses a tagged union receive item plus dedicated status indications."
    decision_required: false
    blocking: false
    status: documented_interface_mismatch

  - id: CR-DL-001
    source_clauses: ["5.5.2.a", "5.5.2.b", "5.5.2.c", "5.5.2.d", "5.5.4.l", "5.5.7.7.a.1", "5.5.7.7.a.3", "5.5.7.7.a.4"]
    source_statement_summary: >
      N-Chars and broadcast codes are bidirectional at the Data Link boundary:
      Network-originated items are TX traffic toward Encoding, while link-originated
      items are RX traffic from Encoding toward Network. In Run, 5.5.7.7.a.3 says
      "Pass received N-Chars and broadcast codes to the Encoding Layer."
    observed_issue: >
      The word "received" does not identify which service boundary supplied the item.
      A literal Network-originated/TX reading is legal but redundant with 5.5.7.7.a.1.
      An Encoding-originated/RX reading would conflict with 5.5.2.d for N-Chars.
      Broadcast-code inclusion is not itself contradictory because broadcast codes
      are valid in both directions.
    handling: >
      Do not use 5.5.7.7.a.3 alone to infer direction. Type every Golden-Model event
      by provenance: NET_TO_DL_NCHAR/BC are transmitted toward Encoding; ENC_TO_DL_NCHAR/BC
      are received from the link and delivered toward Network. This behavior is already
      fixed by 5.5.2 and the credit/service clauses, so 5.5.7.7.a.3 is retained as a
      documented editorial/wording anomaly and is non-blocking.
    decision_required: false
    blocking: false
    status: documented_non_blocking_source_anomaly

  - id: CR-DL-002
    source_clause: "5.5.8.4.b.1"
    source_statement_summary: >
      Recovery exits when all error recovery actions "listed in 5.5.8.4.b" are complete,
      although the action list immediately preceding it is in 5.5.8.4.a; the phrase
      "move to the Normal state" is also duplicated.
    observed_conflict: editorial_self_reference_and_duplicate_phrase
    handling: preserve_source_wording_and_use_the_immediately_preceding_5.5.8.4.a_action_list
    decision_required: false
    blocking: false
    status: documented_source_issue

  - id: CR-NET-001
    source_clauses: ["5.6.2.1.a", "5.6.2.1.d"]
    source_statement_summary: >
      Clause 5.6.2.1.a says a packet comprises one or more data characters
      followed by EOP/EEP, while 5.6.2.1.d explicitly says a packet contains
      zero or more data characters and its note describes handling of an empty packet.
    observed_conflict: minimum_packet_data_character_count_is_one_vs_zero
    handling: >
      Model zero-data-character packets as syntactically valid SpaceWire packets.
      This follows the more specific 5.6.2.1.d requirement and its explicit empty-packet
      note; a routing switch discards an empty packet when encountered.
    decision_required: false
    blocking: false
    status: documented_non_blocking_internal_conflict
