  - id: CR-ENC-012
    source_clause: "5.4.4.e"
    source_statement_summary: "Reset delay shall be between 500 ns and the period of the fastest transmit time for the implementation."
    observed_conflict: >
      Current contract/test artifacts encode min=500 ns and max=fastest-transmit period.
      For any transmitter faster than 2 Mbps, the fastest-transmit period is less than
      500 ns, so that min/max ordering is internally impossible.
    handling: explicit_interpretation_decision
    decision_required: false
    decision_ref: DEC-ENC-002
    blocking: false
    status: resolved_by_interpretation

