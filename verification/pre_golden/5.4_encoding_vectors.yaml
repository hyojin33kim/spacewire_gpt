schema_version: 1
spec: ECSS-E-ST-50-12C-Rev.1
artifact: Encoding pre-Golden test vectors and invariants
status: reviewed
purpose: >
  Independent expected behavior derived from specification/contracts before
  executable Golden Model implementation. These vectors are not generated
  from Golden Model code.

test_groups:
  - id: TV-ENC-CHAR
    contract: BC-ENC-CHAR-001
    requirements:
      - SPW-5.4.3.1-a
      - SPW-5.4.3.1-b
      - SPW-5.4.3.1-c
      - SPW-5.4.3.2-a
      - SPW-5.4.3.2-b
      - SPW-5.4.3.2-c
      - SPW-5.4.3.2-d
      - SPW-5.4.3.2-e
      - SPW-5.4.3.2-f
      - SPW-5.4.3.3-b
      - SPW-5.4.3.3-c
    vectors:
      - id: TV-ENC-CHAR-001
        stimulus: {kind: data_character, value: "0x00"}
        expect: {symbol_width_bits: 10, data_control_flag: 0, data_order: LSB_first}
      - id: TV-ENC-CHAR-002
        stimulus: {kind: data_character, value: "0xA5"}
        expect: {symbol_width_bits: 10, data_control_flag: 0, data_order: LSB_first}
      - id: TV-ENC-CTRL-001
        stimulus: {kind: control_character, value: FCT}
        expect: {symbol_width_bits: 4, data_control_flag: 1, control_type: "0b00"}
      - id: TV-ENC-CTRL-002
        stimulus: {kind: control_character, value: EOP}
        expect: {symbol_width_bits: 4, data_control_flag: 1, control_type: "0b10"}
      - id: TV-ENC-CTRL-003
        stimulus: {kind: control_character, value: EEP}
        expect: {symbol_width_bits: 4, data_control_flag: 1, control_type: "0b01"}
      - id: TV-ENC-CTRL-004
        stimulus: {kind: control_character, value: ESC}
        expect: {symbol_width_bits: 4, data_control_flag: 1, control_type: "0b11"}
      - id: TV-ENC-CODE-001
        stimulus: {kind: control_code, value: NULL}
        expect: {sequence: [ESC, FCT]}
      - id: TV-ENC-CODE-002
        stimulus: {kind: broadcast_code, value: "0b10101101"}
        expect: {sequence: [ESC, DATA_CHARACTER], type_field: "0b10", value_field: "0b101101"}

  - id: TV-ENC-PARITY
    contract: BC-ENC-CHAR-001
    requirements: [SPW-5.4.3.4-a, SPW-5.4.3.4-b, SPW-5.4.3.4-c]
    vectors:
      - id: TV-ENC-PARITY-001
        stimulus:
          previous_character: {kind: data_character, payload: "0x5C"}
          current_character: {kind: ESC, data_control_flag: 1}
        expect:
          current_parity_bit: 0
          reason: "0x5C contains four 1s; plus current C=1 is already odd"
      - id: TV-ENC-PARITY-002
        stimulus:
          previous_character: {kind: ESC, control_type: "0b11"}
          current_character: {kind: FCT, data_control_flag: 1}
        expect:
          current_parity_bit: 0
          reason: "previous type bits contain two 1s; plus current C=1 is odd"
      - id: TV-ENC-PARITY-003
        stimulus:
          previous_character: {kind: data_character, payload: "0x00"}
          current_character: {kind: data_character, data_control_flag: 0}
        expect: {current_parity_bit: 1}
      - id: TV-ENC-PARITY-004
        stimulus:
          previous_character: {kind: data_character, payload: "0x01"}
          current_character: {kind: data_character, data_control_flag: 0}
        expect: {current_parity_bit: 0}
      - id: TV-ENC-PARITY-005
        stimulus:
          precondition: gotNull_asserted
          operation: flip_one_bit_inside_parity_coverage
        expect: {parity_error: true}

  - id: TV-ENC-DS
    contract: BC-ENC-DS-001
    requirements:
      - SPW-5.2.4-a-2
      - SPW-5.4.4-a-1
      - SPW-5.4.4-a-2
      - SPW-5.4.4-b
      - SPW-5.4.4-c
      - SPW-5.4.4-d
      - SPW-5.4.4-e
      - SPW-5.4.4-f
    vectors:
      - id: TV-ENC-DS-001
        stimulus:
          initial: {Data: 0, Strobe: 0}
          serial_bits: [0,1,0,0,1,1,0,1,1,0]
        expect:
          data_levels_after_each_bit:   [0,1,0,0,1,1,0,1,1,0]
          strobe_levels_after_each_bit: [1,1,1,0,0,1,1,1,0,0]
          recovered_serial_bits:        [0,1,0,0,1,1,0,1,1,0]
          evidence: "Figure 5-16 and 5.2.4.a.2"
      - id: TV-ENC-DS-002
        stimulus: power_up_reset
        expect: {Data: 0, Strobe: 0}
      - id: TV-ENC-DS-003
        stimulus:
          controlled_output_port_reset_after_transmission: true
          fastest_supported_rate: Fmax
        expect:
          simultaneous_Data_Strobe_transition: false
          inter_signal_reset_delay:
            lower_bound: "1/Fmax"
            upper_bound: "500 ns"
            exact_cycle_count: deferred_to_RTL_contract
      - id: TV-ENC-DS-004
        stimulus: simultaneous_Data_Strobe_transition_at_receiver
        expect: {receiver_lockup: false}

  - id: TV-ENC-NULL
    contract: BC-ENC-RXERR-001
    requirements:
      - SPW-5.4.5-a
      - SPW-5.4.6-a
      - SPW-5.4.6-b
      - SPW-5.4.6-c
      - SPW-5.4.6-d
    vectors:
      - id: TV-ENC-NULL-001
        stimulus: first_Null_after_TX_ENABLE_asserted
        expect:
          transmitted_bit_sequence: [0,1,1,1,0,1,0,0]
          first_bit: parity_zero
          first_transition: Strobe
          evidence: "5.4.5.a / Figure 5-17"
      - id: TV-ENC-NULL-002
        stimulus:
          RX_ENABLE: asserted
          received_detection_sequence: [0,1,1,1,0,1,0,0,0]
        expect:
          gotNull: asserted
          evidence: "5.4.6.c-d / Figure 5-18; exact sequence is explanatory NOTE evidence"
      - id: TV-ENC-NULL-003
        stimulus: RX_ENABLE_deasserted_after_gotNull
        expect: {gotNull: cleared}
      - id: TV-ENC-NULL-004
        stimulus: received_character_before_gotNull
        expect: {deliver_to_data_link: false}
      - id: TV-ENC-NULL-005
        stimulus: first_Null_with_error_in_any_required_parity_context
        expect: {gotNull: not_asserted}

  - id: TV-ENC-ERR
    contract: BC-ENC-RXERR-001
    requirements: [SPW-5.4.7-a, SPW-5.4.7-b, SPW-5.4.9-a, SPW-5.4.9-b]
    vectors:
      - {id: TV-ENC-ERR-001, stimulus: [ESC, ESC], expect: {ESC_error: true}}
      - {id: TV-ENC-ERR-002, stimulus: [ESC, EOP], expect: {ESC_error: true}}
      - {id: TV-ENC-ERR-003, stimulus: [ESC, EEP], expect: {ESC_error: true}}
      - {id: TV-ENC-ERR-004, stimulus: [ESC, FCT], expect: {ESC_error: false, decode_as: NULL}}
      - {id: TV-ENC-ERR-005, stimulus: [ESC, DATA_CHARACTER], expect: {ESC_error: false, decode_as: BROADCAST_CODE}}
      - id: TV-ENC-ERR-006
        stimulus: parity_error_before_gotNull
        expect: {parity_error_detection_active: false}
      - id: TV-ENC-ERR-007
        stimulus: parity_error_after_gotNull
        expect: {parity_error_detection_active: true}

  - id: TV-ENC-DISC
    contract: BC-ENC-RXERR-001
    requirements: [SPW-5.4.8-a, SPW-5.4.8-b, SPW-5.4.8-c]
    vectors:
      - id: TV-ENC-DISC-001
        stimulus: no_edge_before_detection_is_armed
        expect: {disconnect: false}
      - id: TV-ENC-DISC-002
        stimulus: first_edge_after_leaving_ErrorReset
        expect: {disconnect_detection_armed: true}
      - id: TV-ENC-DISC-003
        stimulus: elapsed_since_last_edge_at_or_below_selected_threshold
        expect: {disconnect: false}
      - id: TV-ENC-DISC-004
        stimulus: elapsed_since_last_edge_above_selected_threshold
        expect: {disconnect: true}
      - id: TV-ENC-DISC-005
        configuration_constraint: {selected_threshold: ">727 ns and <=1 us"}
        expect: {configuration_valid: true}

  - id: TV-ENC-RATE
    contract: BC-ENC-RATE-001
    requirements:
      - SPW-5.4.10.1-a
      - SPW-5.4.10.1-b
      - SPW-5.4.10.2-a
      - SPW-5.4.10.2-b
      - SPW-5.4.10.3-a
      - SPW-5.4.10.3-b
      - SPW-5.4.10.3-c
      - SPW-5.4.10.3-d
      - SPW-5.4.10.4-a
      - SPW-5.4.10.4-b
    vectors:
      - id: TV-ENC-RATE-001
        stimulus: reset
        expect: {output_rate_range_Mbps: [9,11]}
      - id: TV-ENC-RATE-002
        stimulus: disconnect
        expect: {output_rate_range_Mbps: [9,11]}
      - id: TV-ENC-RATE-003
        stimulus: no_new_rate_setting_after_initialization
        expect: {remain_in_initial_rate_range_Mbps: [9,11]}
      - id: TV-ENC-RATE-004
        stimulus: implementation_declares_standard_minimum_supported
        expect: {minimum_supported_rate_Mbps: 2}
      - id: TV-ENC-RATE-005
        stimulus: implementation_maximum_rate
        expect:
          maximum_rate_not_less_than_initial_operating_rate: true
          maximum_rate_must_decode_received_bits_correctly: true
      - id: TV-ENC-RATE-006
        stimulus: opposite_directions_configured_to_different_valid_rates
        expect: {supported: true}

  - id: TV-ENC-IF
    contracts: [BC-ENC-PIPE-001, BC-ENC-IF-001]
    vectors:
      - id: TV-ENC-IF-001
        stimulus: TX_ENABLE_request
        expect: {output_port_enabled: true}
      - id: TV-ENC-IF-002
        stimulus: RX_ENABLE_request
        expect: {input_port_enabled: true}
      - id: TV-ENC-IF-003
        stimulus: receive_error_parity
        expect: {indication: RECEIVE_ERROR, RX_Error_Flags_contains: parity_error}
      - id: TV-ENC-IF-004
        stimulus: receive_error_ESC
        expect: {indication: RECEIVE_ERROR, RX_Error_Flags_contains: ESC_error}
      - id: TV-ENC-IF-005
        stimulus: gotNull_event
        expect:
          indication: gotNull
          data_link_effect_reference: "5.5.7 / Figure 5-19 per DEC-ENC-001"

invariants:
  - {id: INV-ENC-001, statement: characters_and_control_codes_preserve_TX_order}
  - {id: INV-ENC-002, statement: valid_received_items_preserve_RX_order}
  - {id: INV-ENC-003, statement: received_items_with_parity_error_are_never_delivered_to_data_link}
  - {id: INV-ENC-004, statement: received_items_are_not_delivered_to_data_link_before_gotNull}
  - {id: INV-ENC-005, statement: gotNull_remains_asserted_until_RX_ENABLE_deasserts}
  - {id: INV-ENC-006, statement: parity_detection_and_ESC_error_detection_are_gated_by_gotNull}
  - {id: INV-ENC-007, statement: normal_DS_encoding_has_exactly_one_Data_or_Strobe_transition_per_bit_boundary}
  - {id: INV-ENC-008, statement: DS_decode_of_valid_DS_encode_recovers_original_serial_bit_stream}
  - {id: INV-ENC-009, statement: controlled_reset_avoids_simultaneous_Data_and_Strobe_transition}
  - {id: INV-ENC-010, statement: disconnect_detection_is_not_armed_until_first_edge_after_ErrorReset_exit}
  - {id: INV-ENC-011, statement: RECEIVE_ERROR_indication_preserves_error_kind}
  - {id: INV-ENC-012, statement: maximum_signalling_rate_is_not_less_than_initial_operating_rate}

freeze_requirement:
  all_vectors_source_traceable: true
  concrete_bit_or_property_oracle_defined_before_golden_model: true
  golden_model_must_not_generate_expected_values_for_these_vectors: true
